<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLDEN - Subsistema de Seguridad y Usuarios</title>
    <!-- Framework CSS: Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .brand-header { background: linear-gradient(135deg, #1e293b, #0f172a); color: #f59e0b; }
        .card-login { max-width: 420px; margin: 80px auto; border-top: 4px solid #f59e0b; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg brand-header shadow-sm">
        <div class="container">
            <span class="navbar-brand fw-bold text-warning">
                <i class="bi bi-gear-wide-connected me-2"></i>DISTRIBUIDORA "GOLDEN"
            </span>
            <div id="navUserSection" class="d-none d-flex align-items-center gap-3">
                <span id="userInfoBadge" class="text-light small"></span>
                <button class="btn btn-outline-warning btn-sm" onclick="cerrarSesion()">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <!-- VISTA 1: LOGIN -->
        <div id="loginView">
            <div class="card card-login shadow">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h4 class="fw-bold">Iniciar Sesión</h4>
                        <p class="text-muted small">Subsistema de Seguridad - Sprint 1</p>
                    </div>
                    <div id="loginAlert" class="alert alert-danger d-none py-2 small"></div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" id="loginEmail" class="form-control" placeholder="admin@golden.bo" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 fw-bold">
                            <i class="bi bi-shield-lock me-1"></i> Ingresar al Sistema
                        </button>
                    </form>
                    <div class="mt-3 p-2 bg-light rounded border small text-secondary">
                        <strong>Acceso Demo:</strong><br>
                        Correo: <code>admin@golden.bo</code> | Clave: <code>admin123</code>
                    </div>
                </div>
            </div>
        </div>

        <!-- VISTA 2: PANEL CRUD DE USUARIOS -->
        <div id="crudView" class="d-none">
            <div class="row g-4">
                <!-- Formulario Crear / Editar -->
                <div class="col-lg-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-dark text-warning fw-bold" id="formTitle">
                            <i class="bi bi-person-plus me-1"></i> Registrar Nuevo Usuario
                        </div>
                        <div class="card-body">
                            <div id="crudAlert" class="alert d-none py-2 small"></div>
                            <form id="userForm">
                                <input type="hidden" id="userId">
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Nombre Completo / Taller</label>
                                    <input type="text" id="nombre" class="form-control" placeholder="Ej. Taller Mecánico Sucre" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Correo Electrónico</label>
                                    <input type="email" id="email" class="form-control" placeholder="usuario@correo.com" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">
                                        Contraseña <span id="passHint" class="text-muted fw-normal"></span>
                                    </label>
                                    <input type="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Rol en el Sistema</label>
                                    <select id="rol" class="form-select" required>
                                        <option value="ADMIN">Administrador</option>
                                        <option value="ALMACENERO">Almacenero</option>
                                        <option value="REPARTIDOR">Repartidor</option>
                                        <option value="CLIENTE_B2B">Cliente B2B (Taller / Flota)</option>
                                        <option value="CLIENTE_B2C">Cliente B2C (Particular)</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Estado</label>
                                    <select id="estado" class="form-select" required>
                                        <option value="ACTIVO">ACTIVO</option>
                                        <option value="INACTIVO">INACTIVO</option>
                                    </select>
                                </div>
                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-warning fw-bold" id="btnGuardar">
                                        <i class="bi bi-save me-1"></i> Guardar Usuario
                                    </button>
                                    <button type="button" class="btn btn-secondary d-none" id="btnCancelar" onclick="resetFormulario()">
                                        Cancelar Edición
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Tabla de Usuarios -->
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                            <h5 class="mb-0 fw-bold"><i class="bi bi-people me-2"></i>Lista de Usuarios Registrados</h5>
                            <button class="btn btn-sm btn-outline-dark" onclick="cargarUsuarios()">
                                <i class="bi bi-arrow-clockwise"></i> Actualizar
                            </button>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>ID</th>
                                            <th>Nombre</th>
                                            <th>Email</th>
                                            <th>Rol</th>
                                            <th>Estado</th>
                                            <th class="text-end">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaUsuarios"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
