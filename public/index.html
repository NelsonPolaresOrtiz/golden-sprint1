<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso ERP - GOLDEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        /* Estilos VIP */
        .card-premium { border: none; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); overflow: hidden; }
        .bg-gradient-dark { background: linear-gradient(135deg, #0f172a, #1e293b); }
        .form-control, .form-select { border-radius: 8px; padding: 0.6rem 1rem; background-color: #f8fafc; border: 1px solid #e2e8f0; }
        .form-control:focus, .form-select:focus { border-color: #f59e0b; box-shadow: 0 0 0 0.25rem rgba(245, 158, 11, 0.25); }
        
        /* Login Específico */
        .login-wrapper { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
        .brand-icon { font-size: 3.5rem; color: #f59e0b; line-height: 1; }
    </style>
</head>
<body>

    <!-- MENÚ (Se inyecta al iniciar sesión) -->
    <div id="menu-contenedor" class="d-none"></div>

    <div class="container py-4">
        
        <!-- ========================================== -->
        <!-- VISTA 1: LOGIN VIP                         -->
        <!-- ========================================== -->
        <div id="loginView" class="login-wrapper">
            <div class="card card-premium" style="max-width: 450px; width: 100%;">
                <!-- Cabecera del Login -->
                <div class="bg-gradient-dark text-center py-5 px-4 rounded-top-4">
                    <i class="bi bi-shield-lock brand-icon mb-2"></i>
                    <h3 class="fw-bolder text-white mb-0">ERP GOLDEN</h3>
                    <p class="text-warning small mb-0 mt-1">Acceso Seguro al Sistema</p>
                </div>
                
                <!-- Cuerpo del Login -->
                <div class="card-body p-4 p-md-5">
                    <div id="loginAlert" class="alert alert-danger d-none py-2 small rounded-3 fw-semibold"></div>
                    <form id="loginForm">
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold text-uppercase tracking-wide">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" id="loginEmail" class="form-control border-start-0 ps-0" placeholder="admin@golden.bo" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold text-uppercase tracking-wide">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                                <input type="password" id="loginPassword" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 fs-5 rounded-3 shadow-sm mb-3">
                            Ingresar
                        </button>
                    </form>
                    <div class="text-center mt-4">
                        <span class="badge bg-light text-secondary border p-2 fw-normal">
                            Demo: <strong>admin@golden.bo</strong> | <strong>admin123</strong>
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- VISTA 2: PANEL CRUD DE USUARIOS VIP        -->
        <!-- ========================================== -->
        <div id="crudView" class="d-none">
            <!-- Título de Sección -->
            <div class="d-flex justify-content-between align-items-end mb-4 mt-2 border-bottom pb-3">
                <div>
                    <h2 class="fw-bolder text-dark mb-0"><i class="bi bi-people-fill text-warning me-2"></i>Gestión de Usuarios</h2>
                    <p class="text-muted mb-0 mt-1">Administración de accesos, roles y talleres autorizados.</p>
                </div>
            </div>

            <div class="row g-4">
                <!-- Columna Izquierda: Formulario -->
                <div class="col-lg-4">
                    <div class="card card-premium h-100">
                        <div class="card-header bg-gradient-dark text-warning fw-bold py-3 border-0" id="formTitle">
                            <i class="bi bi-person-plus-fill me-1"></i> Registrar Usuario
                        </div>
                        <div class="card-body p-4">
                            <div id="crudAlert" class="alert d-none py-2 small rounded-3"></div>
                            <form id="userForm">
                                <input type="hidden" id="userId">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-muted">Nombre Completo / Taller</label>
                                    <input type="text" id="nombre" class="form-control" placeholder="Ej. Taller Mecánico Sucre" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-muted">Correo Electrónico</label>
                                    <input type="email" id="email" class="form-control" placeholder="usuario@correo.com" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-muted">
                                        Contraseña <span id="passHint" class="text-secondary fw-normal"></span>
                                    </label>
                                    <input type="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres">
                                </div>
                                <div class="row">
                                    <div class="col-6 mb-4">
                                        <label class="form-label small fw-bold text-muted">Rol</label>
                                        <select id="rol" class="form-select" required>
                                            <option value="ADMIN">Admin</option>
                                            <option value="ALMACENERO">Almacenero</option>
                                            <option value="REPARTIDOR">Repartidor</option>
                                            <option value="CLIENTE_B2B">Cliente B2B</option>
                                            <option value="CLIENTE_B2C">Cliente B2C</option>
                                        </select>
                                    </div>
                                    <div class="col-6 mb-4">
                                        <label class="form-label small fw-bold text-muted">Estado</label>
                                        <select id="estado" class="form-select" required>
                                            <option value="ACTIVO">ACTIVO</option>
                                            <option value="INACTIVO">INACTIVO</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-warning fw-bold rounded-3 shadow-sm" id="btnGuardar">
                                        <i class="bi bi-save me-1"></i> Guardar
                                    </button>
                                    <button type="button" class="btn btn-light border d-none rounded-3 fw-bold text-secondary" id="btnCancelar" onclick="resetFormulario()">
                                        Cancelar Edición
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Columna Derecha: Tabla -->
                <div class="col-lg-8">
                    <div class="card card-premium h-100">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3 border-bottom-0">
                            <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-list-columns-reverse text-warning me-2"></i>Directorio</h5>
                            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 fw-bold" onclick="cargarUsuarios()">
                                <i class="bi bi-arrow-clockwise"></i> Refrescar
                            </button>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0 border-top">
                                    <thead class="table-light text-muted small text-uppercase">
                                        <tr>
                                            <th class="ps-4">ID</th>
                                            <th>Usuario / Contacto</th>
                                            <th>Rol</th>
                                            <th>Estado</th>
                                            <th class="text-end pe-4">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaUsuarios"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="menu.js?v=5"></script>
    <script src="app.js?v=5"></script>
</body>
</html>
