<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - GOLDEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', system-ui, sans-serif; }
        .card-kpi { border: none; border-radius: 16px; transition: transform 0.3s; color: white; }
        .card-kpi:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.15); }
        .bg-ingresos { background: linear-gradient(135deg, #10b981, #059669); }
        .bg-ventas { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .bg-alertas { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .card-premium { border: none; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div id="menu-contenedor"></div>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-end mb-4 border-bottom pb-3">
            <div>
                <h2 class="fw-bolder text-dark mb-0"><i class="bi bi-bar-chart-fill text-warning me-2"></i>Panel de Control</h2>
                <p class="text-muted mb-0 mt-1">Resumen financiero y operativo de la Distribuidora.</p>
            </div>
        </div>

        <!-- TARJETAS DE MÉTRICAS (KPIs) -->
        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="card card-kpi bg-ingresos h-100 p-4 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center">
                        <div><h6 class="fw-bold mb-2 text-white-50 text-uppercase tracking-wide">Ingresos Totales</h6><h1 class="fw-bolder mb-0">Bs. <span id="kpiIngresos">0.00</span></h1></div>
                        <i class="bi bi-cash-coin display-3 opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-kpi bg-ventas h-100 p-4 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center">
                        <div><h6 class="fw-bold mb-2 text-white-50 text-uppercase tracking-wide">Ventas Realizadas</h6><h1 class="fw-bolder mb-0" id="kpiVentas">0</h1></div>
                        <i class="bi bi-cart-check-fill display-3 opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-kpi bg-alertas h-100 p-4 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center">
                        <div><h6 class="fw-bold mb-2 text-white-50 text-uppercase tracking-wide">Alertas de Stock</h6><h1 class="fw-bolder mb-0" id="kpiAlertas">0</h1></div>
                        <i class="bi bi-exclamation-octagon-fill display-3 opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABLA DE ÚLTIMAS TRANSACCIONES -->
        <div class="card card-premium">
            <div class="card-header bg-white fw-bold py-3 border-bottom"><i class="bi bi-clock-history me-1"></i> Últimas 5 Transacciones</div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light text-muted small text-uppercase">
                            <tr><th class="ps-4">Orden #</th><th>Cliente</th><th>Fecha y Hora</th><th>Monto</th><th class="text-end pe-4">Estado</th></tr>
                        </thead>
                        <tbody id="tablaUltimosPedidos"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="menu.js?v=8"></script>
    <script src="dashboard.js"></script>
</body>
</html>
