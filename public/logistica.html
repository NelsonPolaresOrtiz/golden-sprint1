<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logística - GOLDEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', system-ui, sans-serif; }
        .card-resumen { border: none; border-radius: 16px; transition: transform 0.3s; }
        .card-resumen:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card-premium { border: none; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); overflow: hidden; }
        .bg-gradient-dark { background: linear-gradient(135deg, #0f172a, #1e293b); }
    </style>
</head>
<body>
    <div id="menu-contenedor"></div>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-end mb-4 border-bottom pb-3">
            <div>
                <h2 class="fw-bolder text-dark mb-0"><i class="bi bi-truck text-warning me-2"></i>Gestión de Entregas</h2>
                <p class="text-muted mb-0 mt-1">Monitorea y cambia el estado de los pedidos de los clientes.</p>
            </div>
        </div>

        <!-- TARJETAS DE RESUMEN (Dashboard Visual) -->
        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="card card-resumen bg-danger bg-opacity-10 text-danger h-100 p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div><h6 class="fw-bold mb-1">Por Preparar</h6><h2 class="fw-bolder mb-0" id="countPendientes">0</h2></div>
                        <i class="bi bi-box-seam display-4 opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-resumen bg-warning bg-opacity-10 text-dark h-100 p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div><h6 class="fw-bold mb-1">En Ruta de Entrega</h6><h2 class="fw-bolder mb-0" id="countRuta">0</h2></div>
                        <i class="bi bi-truck display-4 opacity-50 text-warning"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-resumen bg-success bg-opacity-10 text-success h-100 p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div><h6 class="fw-bold mb-1">Entregados (Éxito)</h6><h2 class="fw-bolder mb-0" id="countEntregados">0</h2></div>
                        <i class="bi bi-check-circle display-4 opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABLA DE DESPACHOS -->
        <div class="card card-premium">
            <div class="card-header bg-gradient-dark text-warning fw-bold py-3"><i class="bi bi-list-task me-1"></i> Lista de Pedidos (Ventas)</div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light text-muted small text-uppercase">
                            <tr><th>Orden #</th><th>Cliente / Taller</th><th>Fecha</th><th>Cobro Total</th><th style="width: 200px;">Estado del Envío</th></tr>
                        </thead>
                        <tbody id="tablaPedidos"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="menu.js?v=7"></script>
    <script src="logistica.js?v=1"></script>
</body>
</html>
