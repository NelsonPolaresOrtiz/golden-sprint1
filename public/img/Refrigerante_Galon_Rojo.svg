<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- Gradientes Galón Refrigerante Orgánico Rojo OAT -->
    <linearGradient id="refRojoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F3EFEA"/>
    </linearGradient>
    <radialGradient id="galonShadowRojo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(28,25,23,0.32)"/>
      <stop offset="100%" stop-color="rgba(28,25,23,0)"/>
    </radialGradient>
    <!-- Bidón Plástico Rojo Carmesí OAT -->
    <linearGradient id="jugBodyRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="15%" stop-color="#DC2626"/>
      <stop offset="35%" stop-color="#EF4444"/>
      <stop offset="65%" stop-color="#B91C1C"/>
      <stop offset="85%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <!-- Tapa Negra de Seguridad -->
    <linearGradient id="blackCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="45%" stop-color="#3F3F46"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <!-- Etiqueta Editorial -->
    <linearGradient id="refLabelRojo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FEF2F2"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#refRojoBg)" rx="8"/>

  <ellipse cx="200" cy="265" rx="88" ry="14" fill="url(#galonShadowRojo)"/>

  <!-- Tapa Galón -->
  <rect x="150" y="24" width="34" height="20" rx="3" fill="url(#blackCap)"/>
  <rect x="153" y="44" width="28" height="14" fill="#3F3F46"/>

  <!-- Silueta de Galonera de 1 Galón / 4 Litros OAT -->
  <path d="M150 58 
           L125 78 
           L125 248 C125 256 132 260 142 260 
           L258 260 C268 260 275 256 275 248 
           L275 100 C275 92 268 85 260 82 
           L220 70 
           L182 58 Z" 
        fill="url(#jugBodyRed)"/>

  <!-- Hueco / Asa -->
  <path d="M210 92 C210 86 215 82 222 84 L244 90 C250 92 254 98 254 105 L254 145 C254 152 248 156 242 154 L220 148 C214 146 210 140 210 133 Z" fill="#F3EFEA"/>

  <!-- Nervaduras -->
  <path d="M132 95 L132 245" stroke="#F87171" stroke-width="2.5" opacity="0.4"/>
  <path d="M140 90 L140 250" stroke="#7F1D1D" stroke-width="2" opacity="0.5"/>

  <!-- Etiqueta Frontal -->
  <rect x="135" y="105" width="70" height="140" rx="4" fill="url(#refLabelRojo)" stroke="#FEE2E2" stroke-width="1.5"/>

  <!-- Cabecera de Etiqueta Carbón -->
  <rect x="135" y="105" width="70" height="24" rx="4" fill="#18181B"/>
  <rect x="135" y="125" width="70" height="4" fill="#B91C1C"/>
  <text x="170" y="121" font-family="'Archivo', Arial, sans-serif" font-weight="900" font-size="9" fill="#FAFAFA" text-anchor="middle" letter-spacing="0.8">GOLDEN</text>

  <!-- Insignia OAT RED -->
  <rect x="141" y="134" width="58" height="22" rx="3" fill="#B91C1C"/>
  <text x="170" y="149" font-family="'Archivo', Arial, sans-serif" font-weight="800" font-size="9.5" fill="#FFFFFF" text-anchor="middle">OAT 50/50</text>

  <text x="170" y="167" font-family="'Archivo', Arial, sans-serif" font-weight="900" font-size="12" fill="#991B1B" text-anchor="middle">ORGÁNICO</text>
  <text x="170" y="176" font-family="'Work Sans', Arial, sans-serif" font-weight="700" font-size="6" fill="#B91C1C" text-anchor="middle">ROJO LARGA VIDA</text>

  <line x1="140" y1="181" x2="200" y2="181" stroke="#FECACA" stroke-width="1"/>

  <text x="170" y="191" font-family="'Chivo Mono', monospace" font-size="5" fill="#374151" text-anchor="middle">5 AÑOS / 250.000 KM</text>
  <text x="170" y="198" font-family="'Chivo Mono', monospace" font-size="5" fill="#374151" text-anchor="middle">ANTIOXIDANTE ALUMINIO</text>
  <text x="170" y="205" font-family="'Chivo Mono', monospace" font-size="5" fill="#374151" text-anchor="middle">ASTM D3306 / D4985</text>

  <!-- Presentación Galón -->
  <rect x="142" y="214" width="56" height="20" rx="3" fill="#18181B"/>
  <text x="170" y="224" font-family="'Archivo', Arial, sans-serif" font-weight="800" font-size="7.5" fill="#FACC15" text-anchor="middle">1 GALÓN</text>
  <text x="170" y="231" font-family="'Work Sans', Arial, sans-serif" font-weight="600" font-size="5" fill="#A1A1AA" text-anchor="middle">3.785 LITROS</text>

  <path d="M136 78 L142 82 L142 245 L136 240 Z" fill="#FFFFFF" opacity="0.2"/>
</svg>