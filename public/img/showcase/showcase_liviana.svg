<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0c0e"/>
      <stop offset="40%" stop-color="#14171c"/>
      <stop offset="80%" stop-color="#1a1e24"/>
      <stop offset="100%" stop-color="#0e1013"/>
    </linearGradient>
    <linearGradient id="roadReflect" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b91c1c" stop-opacity="0"/>
      <stop offset="35%" stop-color="#b91c1c" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#b91c1c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#2a2e36"/>
      <stop offset="30%" stop-color="#181a1f"/>
      <stop offset="70%" stop-color="#0f1114"/>
      <stop offset="100%" stop-color="#242730"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="900" fill="url(#bgGrad1)"/>

  <!-- Ambient Light Streaks & Speed Lines -->
  <g opacity="0.18">
    <path d="M-100 350 L1300 280" stroke="#f87171" stroke-width="1.5" stroke-dasharray="12 24"/>
    <path d="M-100 420 L1300 370" stroke="#f87171" stroke-width="2"/>
    <path d="M-100 500 L1300 460" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="8 30"/>
    <path d="M-100 620 L1300 600" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
  </g>

  <!-- Ground / Highway Horizon -->
  <path d="M0 640 L1200 640 L1200 900 L0 900 Z" fill="#090a0c"/>
  <ellipse cx="600" cy="650" rx="480" ry="16" fill="url(#roadReflect)"/>
  <line x1="0" y1="640" x2="1200" y2="640" stroke="#262930" stroke-width="2"/>

  <!-- Aerodynamic Car Silhouette (Porsche / Modern Grand Tourer Style) -->
  <g transform="translate(160, 220)">
    <!-- Drop Shadow below car -->
    <ellipse cx="440" cy="425" rx="420" ry="24" fill="#000000" opacity="0.8" filter="url(#glowBlur)"/>

    <!-- Car Body Silhouette -->
    <path d="M60 380 
             C90 380 120 340 180 340 
             C240 340 270 380 300 380 
             L560 380 
             C590 380 620 340 680 340 
             C740 340 770 380 800 380 
             L830 380 
             C845 375 850 365 840 350 
             L790 310 
             C760 290 730 270 690 260 
             L580 200 
             C530 170 450 155 360 160 
             L250 200 
             L160 250 
             C100 280 60 320 40 355 
             C35 368 45 380 60 380 Z" 
          fill="url(#carBody)" stroke="#3a3f4a" stroke-width="2"/>

    <!-- Roofline & Glass Cabin -->
    <path d="M260 205 
             C350 165 440 160 520 190 
             L640 250 
             C650 255 640 265 620 265 
             L280 265 
             C240 265 230 240 260 205 Z" 
          fill="#0a0c0f" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Side Window Pillar Detail -->
    <path d="M420 175 L435 265" stroke="#1f2329" stroke-width="4"/>

    <!-- Aerodynamic Side Contour Line -->
    <path d="M120 305 Q350 300 580 285 Q720 295 780 315" fill="none" stroke="#475569" stroke-width="2" opacity="0.6"/>
    <path d="M160 335 Q400 330 650 320" fill="none" stroke="#1e293b" stroke-width="3"/>

    <!-- Front LED Laser Matrix Headlight -->
    <path d="M70 335 L125 328 L110 342 Z" fill="#38bdf8" filter="url(#glowBlur)"/>
    <path d="M60 340 Q110 335 130 330" stroke="#e0f2fe" stroke-width="4" fill="none" filter="url(#glowBlur)"/>
    <!-- Headlight Beam onto Road -->
    <polygon points="50,340 -120,440 -100,500 70,360" fill="#38bdf8" opacity="0.12" filter="url(#glowBlur)"/>

    <!-- Continuous Crimson Rear Tail-light Bar (Porsche Style) -->
    <path d="M780 315 L835 338 L840 345 L795 342 Z" fill="url(#redGlow)" filter="url(#glowBlur)"/>
    <line x1="770" y1="322" x2="845" y2="343" stroke="#ef4444" stroke-width="4" filter="url(#glowBlur)"/>
    <!-- Red Light Trail to the Right -->
    <path d="M840 342 L1000 355 L1000 375 L830 350 Z" fill="#ef4444" opacity="0.18" filter="url(#glowBlur)"/>

    <!-- Front Wheel Assembly -->
    <g transform="translate(180, 340)">
      <circle cx="50" cy="50" r="50" fill="#090a0d"/>
      <circle cx="50" cy="50" r="44" fill="#14171d" stroke="#2d323d" stroke-width="3"/>
      <!-- Alloy Wheel Spokes -->
      <circle cx="50" cy="50" r="28" fill="#1a1e26" stroke="#475569" stroke-width="2"/>
      <path d="M50 8 L50 92 M8 50 L92 50 M20 20 L80 80 M20 80 L80 20" stroke="#64748b" stroke-width="3"/>
      <!-- Red Brake Caliper -->
      <rect x="26" y="24" width="14" height="22" rx="3" fill="#dc2626"/>
      <circle cx="50" cy="50" r="10" fill="#0f1115" stroke="#ef4444" stroke-width="1.5"/>
    </g>

    <!-- Rear Wheel Assembly -->
    <g transform="translate(680, 340)">
      <circle cx="50" cy="50" r="50" fill="#090a0d"/>
      <circle cx="50" cy="50" r="44" fill="#14171d" stroke="#2d323d" stroke-width="3"/>
      <!-- Alloy Wheel Spokes -->
      <circle cx="50" cy="50" r="28" fill="#1a1e26" stroke="#475569" stroke-width="2"/>
      <path d="M50 8 L50 92 M8 50 L92 50 M20 20 L80 80 M20 80 L80 20" stroke="#64748b" stroke-width="3"/>
      <!-- Red Brake Caliper -->
      <rect x="60" y="24" width="14" height="22" rx="3" fill="#dc2626"/>
      <circle cx="50" cy="50" r="10" fill="#0f1115" stroke="#ef4444" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Technical Spec Watermark Overlay -->
  <g opacity="0.25" font-family="'Inter', monospace" font-size="12" fill="#94a3b8">
    <text x="60" y="80">SERIE: LIVIANA // MOTOR 4 CILINDROS TURBOCHARGED</text>
    <text x="60" y="100">VISCOSIDAD: 0W-20 · 5W-30 API SP · ILSAC GF-6A</text>
  </g>
</svg>