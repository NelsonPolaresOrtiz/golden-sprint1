<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="nightRoadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="50%" stop-color="#0f131a" />
      <stop offset="100%" stop-color="#181c24" />
    </linearGradient>
    <linearGradient id="asphaltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141820" />
      <stop offset="100%" stop-color="#090b0e" />
    </linearGradient>
    <linearGradient id="sportFairing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="exhaustTitanium" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <radialGradient id="headlightLaser" cx="15%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tailLightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Atmospheric Highway & Tunnel Lights -->
  <rect width="1200" height="520" fill="url(#nightRoadGrad)" />
  <rect y="520" width="1200" height="280" fill="url(#asphaltGrad)" />

  <!-- High-speed neon motion blur streaks in background -->
  <g opacity="0.4">
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#38bdf8" stroke-width="2" stroke-dasharray="100 250"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="80 180"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="60 300"/>
    <line x1="0" y1="460" x2="1200" y2="460" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="120 200"/>
  </g>

  <!-- Road markings with speed perspective -->
  <g stroke="#ffffff" stroke-width="4" opacity="0.4">
    <line x1="0" y1="680" x2="1200" y2="680" stroke-dasharray="80 60"/>
    <line x1="0" y1="760" x2="1200" y2="760" stroke-dasharray="120 80" stroke-width="6"/>
  </g>

  <!-- Sport Motorcycle (Lean angle, aerodynamic supersport) -->
  <g transform="translate(320, 240) rotate(-3, 300, 250)">
    <!-- Speed Trail / Afterglow -->
    <path d="M 600 240 L 780 230 L 750 260 Z" fill="#b91c1c" opacity="0.25" filter="blur(6px)"/>
    <circle cx="580" cy="235" r="45" fill="url(#tailLightGlow)"/>

    <!-- Exhaust system (Titanium glow) -->
    <path d="M 320 330 Q 420 360 480 320 L 540 280 L 535 255 L 470 290 Q 410 320 330 300 Z" fill="url(#exhaustTitanium)" filter="drop-shadow(0 0 8px rgba(56,189,248,0.5))"/>

    <!-- Rear Swingarm & Chain -->
    <polygon points="340,300 520,320 520,335 340,320" fill="#334155"/>
    <line x1="330" y1="310" x2="520" y2="328" stroke="#d97706" stroke-width="4" stroke-dasharray="6 4"/>

    <!-- Rear Sport Wheel (17" Forged Rim & Low-profile Slick) -->
    <circle cx="520" cy="320" r="105" fill="#090b0e" stroke="#1e242d" stroke-width="26"/>
    <!-- Rim & Spokes -->
    <circle cx="520" cy="320" r="65" fill="#0f172a" stroke="#b91c1c" stroke-width="4"/>
    <g stroke="#f8fafc" stroke-width="4" opacity="0.8">
      <line x1="520" y1="255" x2="520" y2="385"/>
      <line x1="465" y1="288" x2="575" y2="352"/>
      <line x1="465" y1="352" x2="575" y2="288"/>
    </g>
    <!-- Perforated Brake Disc -->
    <circle cx="520" cy="320" r="45" fill="none" stroke="#64748b" stroke-width="8" stroke-dasharray="6 3"/>

    <!-- Twin-spar Aluminum Frame & Engine Block -->
    <polygon points="260,200 360,200 380,310 280,310" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <!-- Engine details / 4-cylinder casing -->
    <rect x="290" y="240" width="70" height="50" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <line x1="300" y1="255" x2="350" y2="255" stroke="#94a3b8" stroke-width="2"/>
    <line x1="300" y1="270" x2="350" y2="270" stroke="#94a3b8" stroke-width="2"/>

    <!-- Fuel Tank & Tail Unit (Crimson Red) -->
    <path d="M 220 180 Q 280 130 350 150 Q 420 160 480 190 L 580 200 L 590 230 L 480 235 L 340 215 L 240 200 Z" fill="url(#sportFairing)" stroke="#dc2626" stroke-width="2"/>
    <!-- Tank Knee Grips -->
    <polygon points="300,165 340,160 330,190 290,190" fill="#0f172a" opacity="0.6"/>

    <!-- Aerodynamic Front Fairing & Windscreen -->
    <path d="M 140 180 Q 180 140 240 150 L 250 190 L 170 230 Z" fill="url(#sportFairing)"/>
    <path d="M 170 145 Q 210 110 240 120 L 245 150 L 190 155 Z" fill="#0284c7" opacity="0.6" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Front Inverted USD Forks (Gold Anodized) -->
    <line x1="220" y1="160" x2="120" y2="330" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
    <line x1="235" y1="160" x2="135" y2="330" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>

    <!-- Front Wheel -->
    <circle cx="120" cy="330" r="105" fill="#090b0e" stroke="#1e242d" stroke-width="24"/>
    <circle cx="120" cy="330" r="65" fill="#0f172a" stroke="#b91c1c" stroke-width="4"/>
    <g stroke="#f8fafc" stroke-width="4" opacity="0.8">
      <line x1="120" y1="265" x2="120" y2="395"/>
      <line x1="65" y1="298" x2="175" y2="362"/>
      <line x1="65" y1="362" x2="175" y2="298"/>
    </g>
    <!-- Big Twin Brake Discs with Brembo Caliper -->
    <circle cx="120" cy="330" r="50" fill="none" stroke="#64748b" stroke-width="10" stroke-dasharray="6 3"/>
    <rect x="145" y="300" width="16" height="28" rx="4" fill="#b91c1c" stroke="#f8fafc" stroke-width="1"/>

    <!-- Laser LED Headlights & Beam -->
    <polygon points="140,195 160,190 155,205 138,205" fill="#ffffff" filter="drop-shadow(0 0 10px #38bdf8)"/>
    <polygon points="140,195 -200,100 -240,360" fill="url(#headlightLaser)" opacity="0.6"/>

    <!-- Aerodynamic Winglet (Downforce) -->
    <polygon points="160,210 190,210 180,225 150,220" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Modern Technical Overlay Badge -->
  <g transform="translate(60, 60)">
    <rect width="360" height="88" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <circle cx="44" cy="44" r="22" fill="#b91c1c" fill-opacity="0.2"/>
    <path d="M 36 44 L 42 50 L 52 38" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="82" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="0.5">LÍNEA MOTOCICLETAS (2T &amp; 4T)</text>
    <text x="82" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Tecnología 4T JASO MA2 · Alto Desempeño</text>
  </g>
</svg>
