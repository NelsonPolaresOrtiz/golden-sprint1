<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- Sombras y Gradientes de la Botella Líquido de Frenos DOT-4 -->
    <linearGradient id="bfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F3EFEA"/>
    </linearGradient>
    <radialGradient id="dropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(28,25,23,0.35)"/>
      <stop offset="100%" stop-color="rgba(28,25,23,0)"/>
    </radialGradient>
    <!-- Cuerpo de Botella Plateada / Carbón Grafito -->
    <linearGradient id="bottleBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="25%" stop-color="#52525B"/>
      <stop offset="50%" stop-color="#3F3F46"/>
      <stop offset="85%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <!-- Tapa Roscada de Seguridad Roja / Carbón -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <!-- Etiqueta Técnica Amarilla / Oro Automotriz -->
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <!-- Indicador de Nivel Traslúcido Ámbar -->
    <linearGradient id="fluidStrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Fondo Limpio Cálido -->
  <rect width="400" height="300" fill="url(#bfBg)" rx="8"/>

  <!-- Sombra Proyectada en el Piso -->
  <ellipse cx="200" cy="264" rx="72" ry="12" fill="url(#dropShadow)"/>

  <!-- Tapa Roscada con Textura -->
  <rect x="184" y="32" width="32" height="24" rx="3" fill="url(#capGrad)"/>
  <line x1="188" y1="36" x2="188" y2="52" stroke="#FEF2F2" stroke-width="1.5" opacity="0.6"/>
  <line x1="193" y1="36" x2="193" y2="52" stroke="#FEF2F2" stroke-width="1.5" opacity="0.6"/>
  <line x1="198" y1="36" x2="198" y2="52" stroke="#FEF2F2" stroke-width="1.5" opacity="0.6"/>
  <line x1="203" y1="36" x2="203" y2="52" stroke="#FEF2F2" stroke-width="1.5" opacity="0.6"/>
  <line x1="208" y1="36" x2="208" y2="52" stroke="#FEF2F2" stroke-width="1.5" opacity="0.6"/>
  <line x1="212" y1="36" x2="212" y2="52" stroke="#FEF2F2" stroke-width="1.5" opacity="0.6"/>

  <!-- Cuello de la Botella -->
  <rect x="187" y="56" width="26" height="18" fill="#3F3F46"/>
  <path d="M187 74 L146 102 L146 252 C146 256 150 260 156 260 L244 260 C250 260 254 256 254 252 L254 102 L213 74 Z" fill="url(#bottleBody)"/>

  <!-- Nervaduras y Refuerzo Ergonómico Lateral -->
  <path d="M152 110 L152 245" stroke="#71717A" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M248 110 L248 245" stroke="#18181B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Franja Translúcida Medidora de Nivel de Fluido (Ámbar) -->
  <rect x="238" y="116" width="6" height="126" rx="3" fill="url(#fluidStrip)"/>
  <line x1="234" y1="130" x2="238" y2="130" stroke="#E4E4E7" stroke-width="1.5"/>
  <line x1="234" y1="160" x2="238" y2="160" stroke="#E4E4E7" stroke-width="1.5"/>
  <line x1="234" y1="190" x2="238" y2="190" stroke="#E4E4E7" stroke-width="1.5"/>
  <line x1="234" y1="220" x2="238" y2="220" stroke="#E4E4E7" stroke-width="1.5"/>

  <!-- Etiqueta Frontal Central -->
  <rect x="158" y="112" width="76" height="134" rx="4" fill="url(#labelGrad)" stroke="#E6E1DA" stroke-width="1.5"/>

  <!-- Header de Marca en la Etiqueta -->
  <rect x="158" y="112" width="76" height="22" rx="4" fill="#18181B"/>
  <rect x="158" y="130" width="76" height="4" fill="#B91C1C"/>
  <text x="196" y="127" font-family="'Archivo', Arial, sans-serif" font-weight="900" font-size="10" fill="#FAFAFA" text-anchor="middle" letter-spacing="1">GOLDEN</text>

  <!-- Insignia Principal DOT 4 -->
  <rect x="166" y="142" width="60" height="26" rx="4" fill="#B91C1C"/>
  <text x="196" y="160" font-family="'Archivo', Arial, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">DOT 4</text>

  <!-- Texto de Especificación Técnica -->
  <text x="196" y="178" font-family="'Work Sans', Arial, sans-serif" font-weight="700" font-size="7" fill="#18181B" text-anchor="middle">LÍQUIDO DE FRENOS</text>
  <text x="196" y="187" font-family="'Work Sans', Arial, sans-serif" font-weight="600" font-size="6" fill="#B45309" text-anchor="middle">100% SINTÉTICO</text>

  <rect x="164" y="193" width="64" height="0.8" fill="#D6D0C7"/>

  <!-- Datos de Rendimiento e Impuestos -->
  <text x="196" y="202" font-family="'Chivo Mono', monospace" font-size="5.5" fill="#52525B" text-anchor="middle">EBULLICIÓN: &gt; 260°C</text>
  <text x="196" y="210" font-family="'Chivo Mono', monospace" font-size="5.5" fill="#52525B" text-anchor="middle">FMVSS 116 / SAE J1704</text>
  <text x="196" y="218" font-family="'Chivo Mono', monospace" font-size="5.5" fill="#047857" text-anchor="middle">ABS / ESP COMPATIBLE</text>

  <!-- Contenido Neto -->
  <rect x="170" y="226" width="52" height="14" rx="2" fill="#18181B"/>
  <text x="196" y="236" font-family="'Archivo', Arial, sans-serif" font-weight="800" font-size="8" fill="#FBBF24" text-anchor="middle">500 ml</text>

  <!-- Brillo Angular en la Botella -->
  <path d="M160 106 L168 106 L168 250 L160 250 Z" fill="#FFFFFF" opacity="0.12"/>
</svg>