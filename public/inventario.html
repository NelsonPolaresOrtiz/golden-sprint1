<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario VIP - GOLDEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        /* Estilos VIP compartidos */
        .card-premium { border: none; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); overflow: hidden; }
        .bg-gradient-dark { background: linear-gradient(135deg, #0f172a, #1e293b); }
        .form-control, .form-select { border-radius: 8px; padding: 0.6rem 1rem; background-color: #f8fafc; border: 1px solid #e2e8f0; }
        .form-control:focus, .form-select:focus { border-color: #f59e0b; box-shadow: 0 0 0 0.25rem rgba(245, 158, 11, 0.25); }
    </style>
</head>
<body>

    <!-- MENÚ INTELIGENTE -->
    <div id="menu-contenedor"></div>

    <div class="container py-4">
        
        <!-- Título de Sección -->
        <div class="d-flex justify-content-between align-items-end mb-4 mt-2 border-bottom pb-3">
            <div>
                <h2 class="fw-bolder text-dark mb-0"><i class="bi bi-box-seam-fill text-warning me-2"></i>Almacén e Inventario</h2>
                <p class="text-muted mb-0 mt-1">Control de stock, precios y registro de nuevos repuestos.</p>
            </div>
        </div>

        <div class="row g-4">
            <!-- Columna Izquierda: Formulario -->
            <div class="col-lg-4">
                <div class="card card-premium h-100">
                    <div class="card-header bg-gradient-dark text-warning fw-bold py-3 border-0" id="formTitle">
                        <i class="bi bi-plus-circle-fill me-1"></i> Registrar Repuesto
                    </div>
                    <div class="card-body p-4">
                        <form id="productoForm">
                            <input type="hidden" id="prodId">
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Código SKU</label>
                                <input type="text" id="sku" class="form-control text-uppercase" placeholder="Ej. FIL-ACE-001" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Nombre del Repuesto</label>
                                <input type="text" id="nombre" class="form-control" placeholder="Ej. Filtro de Aceite Toyota" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Categoría</label>
                                <select id="categoria" class="form-select" required>
                                    <option value="Aceites Minerales">Aceites Minerales</option>
                                    <option value="Aceites Sintéticos">Aceites Sintéticos</option>
                                    <option value="Filtros de Aceite">Filtros de Aceite</option>
                                    <option value="Filtros de Aire">Filtros de Aire</option>
                                </select>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-4">
                                    <label class="form-label small fw-bold text-muted">Precio (Bs.)</label>
                                    <input type="number" id="precio" class="form-control" step="0.10" placeholder="0.00" required>
                                </div>
                                <div class="col-6 mb-4">
                                    <label class="form-label small fw-bold text-muted">Stock Inicial</label>
                                    <input type="number" id="stock" class="form-control" placeholder="0" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-warning w-100 fw-bold rounded-3 shadow-sm py-2">
                                <i class="bi bi-cloud-arrow-up-fill me-1"></i> Guardar Producto
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Tabla y Buscador -->
            <div class="col-lg-8">
                <div class="card card-premium h-100">
                    
                    <!-- Cabecera con Buscador Moderno -->
                    <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center py-3 border-bottom-0 gap-3">
                        <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-boxes text-warning me-2"></i>Catálogo Interno</h5>
                        <div class="input-group" style="max-width: 320px;">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-search"></i></span>
                            <input type="text" id="buscadorInventario" class="form-control border-start-0 ps-0 bg-light" placeholder="Buscar SKU, nombre...">
                        </div>
                    </div>
                    
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 border-top">
                                <thead class="table-light text-muted small text-uppercase">
                                    <tr>
                                        <th class="ps-4">SKU</th>
                                        <th>Detalles del Producto</th>
                                        <th>Precio</th>
                                        <th>Stock</th>
                                        <th class="text-end pe-4">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaProductos"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="menu.js?v=6"></script>
    <script src="inventario.js?v=6"></script>
</body>
</html>
