<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda VIP - GOLDEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        /* DISEÑO DE LA CABECERA (HERO) */
        .hero-tienda {
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('https://images.unsplash.com/photo-1619642751034-765dfdf7c58e?auto=format&fit=crop&w=1200&q=80') center/cover;
            color: white;
            padding: 4rem 0;
            border-bottom: 5px solid #f59e0b;
        }

        /* DISEÑO DE LAS TARJETAS (CARDS) */
        .card-producto {
            border: none;
            border-radius: 16px;
            transition: all 0.3s ease;
            background: #ffffff;
            overflow: hidden;
        }
        .card-producto:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.12) !important;
        }
        
        /* IMAGEN SIMULADA CON COLORES */
        .img-placeholder {
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            transition: transform 0.3s ease;
        }
        .card-producto:hover .img-placeholder { transform: scale(1.05); }
        .aceite-bg { background: linear-gradient(135deg, #fcd34d, #f59e0b); color: #fff; }
        .filtro-bg { background: linear-gradient(135deg, #cbd5e1, #64748b); color: #fff; }
        .default-bg { background: #e2e8f0; color: #94a3b8; }

        /* BOTONES DE FILTRO */
        .btn-filter { border-radius: 20px; font-weight: 500; }
        .btn-filter.active { background-color: #0f172a; color: #f59e0b; border-color: #0f172a; }
    </style>
</head>
<body>

    <!-- MENÚ INTELIGENTE -->
    <div id="menu-contenedor"></div>

    <!-- CABECERA ESPECTACULAR (HERO) -->
    <div class="hero-tienda text-center shadow-sm">
        <div class="container">
            <h1 class="fw-bolder display-5 text-warning mb-3"><i class="bi bi-shop"></i> Tienda Oficial GOLDEN</h1>
            <p class="lead text-light mb-0">El catálogo más completo de lubricantes y filtros para tu vehículo o flota pesada.</p>
        </div>
    </div>

    <!-- CATÁLOGO Y FILTROS -->
    <div class="container py-5 mb-5">
        
        <!-- Botones de Filtrado Rápido -->
        <div class="d-flex justify-content-center flex-wrap gap-2 mb-5">
            <button class="btn btn-outline-dark btn-filter active" onclick="filtrarCategoria('Todos', this)">Todo el Catálogo</button>
            <button class="btn btn-outline-dark btn-filter" onclick="filtrarCategoria('Aceites Minerales', this)"><i class="bi bi-droplet me-1"></i>Minerales</button>
            <button class="btn btn-outline-dark btn-filter" onclick="filtrarCategoria('Aceites Sintéticos', this)"><i class="bi bi-droplet-half me-1"></i>Sintéticos</button>
            <button class="btn btn-outline-dark btn-filter" onclick="filtrarCategoria('Filtros de Aceite', this)"><i class="bi bi-funnel me-1"></i>Filtros Aceite</button>
            <button class="btn btn-outline-dark btn-filter" onclick="filtrarCategoria('Filtros de Aire', this)"><i class="bi bi-wind me-1"></i>Filtros Aire</button>
        </div>

        <!-- Contenedor de Tarjetas -->
        <div class="row g-4" id="catalogoProductos">
            <!-- Las tarjetas VIP se dibujarán aquí -->
        </div>
    </div>

    <!-- MENÚ LATERAL DEL CARRITO DE COMPRAS -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="carritoLateral" aria-labelledby="carritoLateralLabel">
        <div class="offcanvas-header bg-dark text-warning">
            <h5 class="offcanvas-title fw-bold" id="carritoLateralLabel"><i class="bi bi-cart-check me-2"></i>Tu Pedido</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div id="listaCarrito" class="flex-grow-1 overflow-auto pe-2">
                <!-- Items del carrito -->
            </div>
            <div class="border-top pt-3 mt-3 bg-white">
                <h5 class="fw-bold d-flex justify-content-between mb-3">
                    Total a Pagar: <span id="totalCarrito" class="text-success fs-4">Bs. 0.00</span>
                </h5>
                <button class="btn btn-success w-100 fw-bold py-3 fs-5 shadow-sm" onclick="procesarCompra()">
                    <i class="bi bi-check2-circle me-1"></i> Confirmar Compra
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap y los nuestros -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="menu.js?v=2"></script>
    <script src="tienda.js?v=5"></script>
</body>
</html>
